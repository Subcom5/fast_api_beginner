<!doctype html>
<html>
  <body>
    <h1>Send JS request</h1>
    <button onclick="getData()">Click me</button>
    <script>
      function getData() {
        fetch("http://localhost:6000/")
          .then((resp) => resp.json())
          .then((data) => {
            console.log(data);
          })
          .catch((error) => {
            console.error(error);
          });
      }
    </script>
  </body>
</html>
